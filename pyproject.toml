[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parley"
version = "0.1.0"
description = "An interruption-native coordination kernel for full-duplex voice agents (Samsung PRISM Y2026, Theme 05)"
requires-python = ">=3.10,<3.13"
# Runtime stays deliberately thin. The 120 s per-scenario cap and the ban on
# runtime downloads mean every dependency has to be small, offline and fast to
# import. scikit-learn trains the interruption classifier but never runs it --
# the fitted weights ship as JSON and inference is numpy only.
dependencies = ["pydantic>=2.6", "numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "scikit-learn>=1.3"]

# Live speech and panel reading. Deliberately *optional*: the scored engine
# imports nothing from either, so the 29 scenarios and the full test suite run
# on a clean install with neither extra present. Both ship their weights inside
# the repo or the wheel -- installing them still downloads nothing at runtime.
voice = ["vosk>=0.3.45"]
vision = ["rapidocr-onnxruntime>=1.3"]
demo = ["parley[voice]", "parley[vision]"]

[tool.setuptools.packages.find]
include = ["parley*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
